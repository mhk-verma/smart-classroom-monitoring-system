<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Control Panel - Smart Classroom</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="animated-background"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="premium-header">
            <div class="header-content">
                <div class="header-branding">
                    <h1 class="header-title">SIMULATION CONTROL PANEL</h1>
                    <p class="header-subtitle">Interactive Testing Environment</p>
                </div>
                <div class="header-status">
                    <span class="status-badge active">
                        <i data-lucide="cpu"></i>
                        SIMULATION ACTIVE
                    </span>
                </div>
            </div>
        </header>

        <!-- Simulation Controls -->
        <div class="simulation-controls">
            <div class="control-section">
                <h2><i data-lucide="thermometer"></i> Sensor Simulation</h2>
                
                <div class="control-group">
                    <label>Temperature (°C)</label>
                    <input type="range" id="manual-temp" min="15" max="40" value="24" step="0.5">
                    <span id="temp-value">24°C</span>
                    <button onclick="setManualSensor('temperature', document.getElementById('manual-temp').value)">Set Temperature</button>
                </div>
                
                <div class="control-group">
                    <label>Humidity (%)</label>
                    <input type="range" id="manual-humidity" min="30" max="90" value="55" step="1">
                    <span id="humidity-value">55%</span>
                    <button onclick="setManualSensor('humidity', document.getElementById('manual-humidity').value)">Set Humidity</button>
                </div>
                
                <div class="control-group">
                    <label>Light Level (0-1000)</label>
                    <input type="range" id="manual-light" min="0" max="1000" value="500" step="10">
                    <span id="light-value">500</span>
                    <button onclick="setManualSensor('light_level', document.getElementById('manual-light').value)">Set Light Level</button>
                </div>
            </div>

            <div class="control-section">
                <h2><i data-lucide="power"></i> Device State Control</h2>
                
                <div class="control-group">
                    <label>DHT22 Sensor</label>
                    <button onclick="forceSensorState('dht22', true)">Enable</button>
                    <button onclick="forceSensorState('dht22', false)">Disable</button>
                </div>
                
                <div class="control-group">
                    <label>PIR Sensor</label>
                    <button onclick="forceSensorState('pir', true)">Enable</button>
                    <button onclick="forceSensorState('pir', false)">Disable</button>
                </div>
                
                <div class="control-group">
                    <label>LDR Sensor</label>
                    <button onclick="forceSensorState('ldr', true)">Enable</button>
                    <button onclick="forceSensorState('ldr', false)">Disable</button>
                </div>
                
                <div class="control-group">
                    <label>Camera</label>
                    <button onclick="forceSensorState('camera', true)">Enable</button>
                    <button onclick="forceSensorState('camera', false)">Disable</button>
                </div>
            </div>

            <div class="control-section">
                <h2><i data-lucide="zap"></i> Appliance Control</h2>
                
                <div class="control-group">
                    <label>Light Device</label>
                    <button onclick="forceDeviceState('light', true)">Enable</button>
                    <button onclick="forceDeviceState('light', false)">Disable</button>
                </div>
                
                <div class="control-group">
                    <label>Fan Device</label>
                    <button onclick="forceDeviceState('fan', true)">Enable</button>
                    <button onclick="forceDeviceState('fan', false)">Disable</button>
                </div>
            </div>

            <div class="control-section">
                <h2><i data-lucide="users"></i> External Influences</h2>
                
                <div class="control-group">
                    <label>Simulate Occupancy Change</label>
                    <button onclick="simulateInfluence('occupancy_change', 5)">+5 People Enter</button>
                    <button onclick="simulateInfluence('occupancy_change', -5)">-5 People Leave</button>
                </div>
                
                <div class="control-group">
                    <label>Simulate Light Change</label>
                    <button onclick="simulateInfluence('light_change', 100)">Increase Light</button>
                    <button onclick="simulateInfluence('light_change', -100)">Decrease Light</button>
                </div>
            </div>

            <div class="control-section">
                <h2><i data-lucide="rotate-ccw"></i> Reset</h2>
                
                <div class="control-group">
                    <button onclick="resetEnergyTracking()" class="reset-button">Reset Energy Tracking</button>
                </div>
            </div>
        </div>

        <!-- Automation Events Log -->
        <div class="events-log">
            <h2><i data-lucide="scroll-text"></i> Automation Events</h2>
            <div id="events-container">
                <p>Loading events...</p>
            </div>
        </div>

        <!-- Navigation -->
        <div class="navigation">
            <a href="/" class="nav-button">
                <i data-lucide="home"></i>
                Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Update slider values display
        document.getElementById('manual-temp').addEventListener('input', function() {
            document.getElementById('temp-value').textContent = this.value + '°C';
        });
        document.getElementById('manual-humidity').addEventListener('input', function() {
            document.getElementById('humidity-value').textContent = this.value + '%';
        });
        document.getElementById('manual-light').addEventListener('input', function() {
            document.getElementById('light-value').textContent = this.value;
        });

        // Simulation control functions
        async function setManualSensor(sensor, value) {
            try {
                const response = await fetch('/api/simulation/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        manual_sensor: sensor,
                        value: parseFloat(value)
                    })
                });
                const data = await response.json();
                if (data.success) {
                    showNotification(`${sensor} set to ${value}`, 'success');
                }
            } catch (error) {
                console.error('Error setting sensor:', error);
            }
        }

        async function forceSensorState(sensor, state) {
            try {
                const response = await fetch('/api/simulation/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        force_sensor_state: sensor,
                        state: state
                    })
                });
                const data = await response.json();
                if (data.success) {
                    showNotification(`${sensor} ${state ? 'enabled' : 'disabled'}`, 'success');
                }
            } catch (error) {
                console.error('Error forcing sensor state:', error);
            }
        }

        async function forceDeviceState(device, state) {
            try {
                const response = await fetch('/api/simulation/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        force_device_state: device,
                        state: state
                    })
                });
                const data = await response.json();
                if (data.success) {
                    showNotification(`${device} ${state ? 'enabled' : 'disabled'}`, 'success');
                }
            } catch (error) {
                console.error('Error forcing device state:', error);
            }
        }

        async function simulateInfluence(type, value) {
            try {
                const response = await fetch('/api/simulation/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        external_influence: type,
                        value: value
                    })
                });
                const data = await response.json();
                if (data.success) {
                    showNotification(`${type}: ${value}`, 'success');
                }
            } catch (error) {
                console.error('Error simulating influence:', error);
            }
        }

        async function resetEnergyTracking() {
            try {
                const response = await fetch('/api/simulation/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reset_energy: true })
                });
                const data = await response.json();
                if (data.success) {
                    showNotification('Energy tracking reset', 'success');
                }
            } catch (error) {
                console.error('Error resetting energy:', error);
            }
        }

        // Load automation events
        async function loadAutomationEvents() {
            try {
                const response = await fetch('/api/automation/events');
                const data = await response.json();
                const container = document.getElementById('events-container');
                
                if (data.events && data.events.length > 0) {
                    container.innerHTML = data.events.map(event => `
                        <div class="event-item">
                            <span class="event-time">${event.timestamp}</span>
                            <span class="event-type">${event.event_type}</span>
                            <span class="event-message">${event.message}</span>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>No automation events yet</p>';
                }
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        // Simple notification function
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Load events on page load
        loadAutomationEvents();
        // Refresh events every 5 seconds
        setInterval(loadAutomationEvents, 5000);
    </script>

    <style>
        .simulation-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .control-section {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .control-section h2 {
            color: #10b981;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            color: #94a3b8;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 10px;
        }

        .control-group span {
            color: #10b981;
            font-weight: bold;
            margin-right: 10px;
        }

        .control-group button {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #10b981;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
            transition: all 0.3s;
        }

        .control-group button:hover {
            background: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }

        .reset-button {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: rgba(239, 68, 68, 0.5) !important;
            color: #ef4444 !important;
        }

        .events-log {
            margin-top: 30px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .events-log h2 {
            color: #3b82f6;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #events-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .event-item {
            padding: 10px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            gap: 15px;
        }

        .event-time {
            color: #94a3b8;
            font-size: 12px;
            min-width: 150px;
        }

        .event-type {
            color: #3b82f6;
            font-weight: bold;
            min-width: 120px;
        }

        .event-message {
            color: #e2e8f0;
        }

        .navigation {
            margin-top: 30px;
            text-align: center;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #3b82f6;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .nav-button:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.success {
            background: rgba(16, 185, 129, 0.9);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</body>
</html>
